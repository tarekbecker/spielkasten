utton.secondary{background:#78716c}button:disabled{opacity:.45}.message{min-height:1.5em;font-weight:750}.version{font-size:.8rem;color:#9a3412}</style></head><body><h1>2048</h1><a class="back" href="index.html">← Zurück zur Spieleauswahl</a><main class="game"><div class="top"><div class="score">PUNKTE<b id="score">0</b></div><div class="score">BESTE<b id="best">0</b></div></div><div class="board" id="board" aria-label="2048 Spielfeld"></div><p class="message" id="message" aria-live="polite"></p><div class="controls"><button id="undo" class="secondary">↩️ Zurück</button><button id="new-game">🔄 Neu</button></div></main><script src="2048.js?v=1.0.0"></script><script src="2048-app.js?v=1.1.0"></script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')</script></body></html>
