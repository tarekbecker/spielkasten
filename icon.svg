<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <radialGradient id="pieceWhite" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#d0d0d0"/>
    </radialGradient>
    <radialGradient id="pieceBlack" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#555555"/>
      <stop offset="100%" style="stop-color:#222222"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  
  <!-- Board pattern -->
  <g transform="translate(15, 15)">
    <!-- Checkerboard background -->
    <rect x="0" y="0" width="70" height="70" rx="5" fill="#f0d9b5"/>
    
    <!-- Dark squares -->
    <rect x="8.75" y="0" width="8.75" height="8.75" fill="#b58863"/>
    <rect x="26.25" y="0" width="8.75" height="8.75" fill="#b58863"/>
    <rect x="43.75" y="0" width="8.75" height="8.75" fill="#b58863"/>
    <rect x="61.25" y="0" width="8.75" height="8.75" fill="#b58863"/>
    
    <rect x="0" y="8.75" width="8.75" height="8.75" fill="#b58863"/>
    <rect x="17.5" y="8.75" width="8.75" height="8.75" fill="#b58863"/>
    <rect x="35" y="8.75" width="8.75" height="8.75" fill="#b58863"/>
    <rect x="52.5" y="8.75" width="8.75" height="8.75" fill="#b58863"/>
    
    <rect x="8.75" y="17.5" width="8.75" height="8.75" fill="#b58863"/>
    <rect x="26.25" y="17.5" width="8.75" height="8.75" fill="#b58863"/>
    <rect x="43.75" y="17.5" width="8.75" height="8.75" fill="#b58863"/>
    <rect x="61.25" y="17.5" width="8.75" height="8.75" fill="#b58863"/>
    
    <rect x="0" y="26.25" width="8.75" height="8.75" fill="#b58863"/>
    <rect x="17.5" y="26.25" width="8.75" height="8.75" fill="#b58863"/>
    <rect x="35" y="26.25" width="8.75" height="8.75" fill="#b58863"/>
    <rect x="52.5" y="26.25" width="8.75" height="8.75" fill="#b58863"/>
    
    <!-- Pieces -->
    <!-- Black pieces -->
    <circle cx="13.125" cy="4.375" r="3.5" fill="url(#pieceBlack)" stroke="#333" stroke-width="0.5"/>
    <circle cx="30.625" cy="4.375" r="3.5" fill="url(#pieceBlack)" stroke="#333" stroke-width="0.5"/>
    <circle cx="48.125" cy="4.375" r="3.5" fill="url(#pieceBlack)" stroke="#333" stroke-width="0.5"/>
    
    <!-- White pieces -->
    <circle cx="4.375" cy="65.625" r="3.5" fill="url(#pieceWhite)" stroke="#333" stroke-width="0.5"/>
    <circle cx="21.875" cy="65.625" r="3.5" fill="url(#pieceWhite)" stroke="#333" stroke-width="0.5"/>
    <circle cx="39.375" cy="65.625" r="3.5" fill="url(#pieceWhite)" stroke="#333" stroke-width="0.5"/>
    
    <!-- Crown on white king -->
    <circle cx="21.875" cy="56.875" r="3.5" fill="url(#pieceWhite)" stroke="#333" stroke-width="0.5"/>
    <text x="21.875" y="58.5" font-size="4" text-anchor="middle" fill="#b8860b">♔</text>
  </g>
</svg>
