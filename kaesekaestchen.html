ackground:#1e40af;color:#fff;font:800 1rem system-ui}.message{min-height:1.5em;font-weight:800}.hint,.version{font-size:.84rem;color:#475569}.version{margin:12px 0 0}</style></head><body><h1>🧀 Käsekästchen</h1><a class="back" href="index.html">← Zurück zur Spieleauswahl</a><main class="game"><div class="scores"><span class="score blue-score">🔵 Blau <b id="blue">0</b></span><span class="score red-score">🔴 Rot <b id="red">0</b></span></div><div id="board" class="board" aria-label="Käsekästchen Spielfeld"></div><p id="message" class="message"></p><button id="new-game">🔄 Neues Spiel</button><p class="hint">Schließe ein Kästchen und du bist noch einmal dran.</p><p class="version">Käsekästchen · Version 1.0.0 · Build 2026-08-09.3</p></main><script src="kaesekaestchen.js?v=1.0.0"></script><script src="kaesekaestchen-app.js?v=1.0.0"></script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')</script></body></html>
