<head>

  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:calc(16px + env(safe-area-inset-top)) 12px calc(28px + env(safe-area-inset-bottom));font-family:system-ui,-apple-system,sans-serif;text-align:center;color:#27134e;background:linear-gradient(145deg,#7c3aed,#c026d3 55%,#f9a8d4)}h1{margin:0 0 3px;color:#fff;font-size:clamp(1.8rem,7vw,2.5rem)}.back{display:inline-block;margin:2px 0 10px;color:#f5f3ff;text-decoration:none;font-weight:800}.game{max-width:560px;margin:auto;padding:15px;background:#fff;border-radius:24px;box-shadow:0 14px 42px #3b076455}.intro{margin:3px auto 10px;font-weight:700;color:#5b21b6}.settings{margin:5px 0 9px;font-size:.9rem;font-weight:800;color:#6d28d9}.settings select{border:0;border-radius:8px;padding:6px;background:#f3e8ff;color:#6d28d9;font:inherit;font-weight:850}.secret{display:flex;justify-content:center;align-items:center;gap:10px;min-height:38px;margin:8px 0 10px;font-size:.9rem;font-weight:900;color:#6d28d9}.code{display:flex;gap:7px;justify-content:center}.code-dot{display:block;width:clamp(25px,8vw,34px);height:clamp(25px,8vw,34px);border-radius:50%;border:3px solid #ddd;box-shadow:inset 0 -3px #0002}.code-dot:disabled{opacity:1}.code-dot.empty{background:#f5f3ff;border-color:#ddd6fe;box-shadow:none}.code-dot.red{background:#ef4444;border-color:#dc2626}.code-dot.blue{background:#3b82f6;border-color:#2563eb}.code-dot.green{background:#22c55e;border-color:#16a34a}.code-dot.yellow{background:#facc15;border-color:#eab308}.code-dot.purple{background:#a855f7;border-color:#9333ea}.code-dot.orange{background:#fb923c;border-color:#ea580c}.hidden-code i{width:24px;height:24px;border-radius:50%;background:#4c1d95;border:3px solid #ddd6fe}.guess-board{border:2px solid #ddd6fe;border-radius:16px;overflow:hidden;background:#faf5ff}.guess-row{min-height:43px;display:grid;grid-template-columns:25px 1fr 64px;align-items:center;gap:5px;padding:4px 8px;border-bottom:1px solid #ede9fe}.guess-row:last-child{border-bottom:0}.guess-row.current{background:#f3e8ff;border:2px solid #a855f7;position:sticky;top:0}.attempt{font-weight:900;color:#7e22ce}.guess-row .code{gap:5px}.guess-row .code-dot{width:27px;height:27px}.current .code-dot{cursor:pointer}.current .code-dot.empty{cursor:default}.feedback{display:grid;grid-template-columns:repeat(2,10px);gap:4px;justify-content:center}.key{display:block;width:10px;height:10px;border-radius:50%;background:#ddd6fe}.key.exact{background:#312e81}.key.color{background:#fff;border:2px solid #7c3aed}.muted{opacity:.45}.message{min-height:1.5em;margin:10px 0 7px;font-weight:850;color:#6d28d9}.palette{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:7px 0 13px}.palette button{width:43px;height:43px;border-radius:50%;border:4px solid #fff;box-shadow:0 2px 0 #0003;cursor:pointer}.palette button:active{transform:scale(.9)}.palette .red{background:#ef4444}.palette .blue{background:#3b82f6}.palette .green{background:#22c55e}.palette .yellow{background:#facc15}.palette .purple{background:#a855f7}.palette .orange{background:#fb923c}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.controls button{border:0;border-radius:12px;padding:11px 14px;background:#7c3aed;color:#fff;font:850 1rem system-ui}.controls button.secondary{background:#64748b}.controls button:disabled{opacity:.5}.tries,.legend,.version{color:#64748b;font-size:.82rem}.tries{margin:8px 0}.legend{margin:13px 0 0}.legend b{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 3px -1px 8px}.legend .dark{background:#312e81}.legend .white{background:#fff;border:2px solid #7c3aed}.version{margin:15px 0 0}@media(max-width:360px){.game{padding:10px}.guess-row{grid-template-columns:20px 1fr 55px;padding:4px}.guess-row .code-dot{width:24px;height:24px}.feedback{grid-template-columns:repeat(2,9px);gap:3px}.key{width:9px;height:9px}}
  </style>
</head>
<body>
  <h1>🧠 Codeknacker</h1><a class="back" href="index.html">← Zurück zur Spieleauswahl</a>
  <main class="game"><p class="intro">Knacke den geheimen Farbcode. Farben dürfen mehrfach vorkommen.</p><p class="settings"><label>Versuche <select id="attempt-limit"><option value="10">10</option><option value="15">15</option><option value="20">20</option></select></label></p><div class="secret" id="secret"></div><div class="guess-board" id="guess-board" aria-label="Deine Tipps"></div><p class="tries" id="tries"></p><p class="message" id="message" aria-live="polite">Wähle vier Farben für deinen ersten Tipp.</p><div class="palette" id="palette" aria-label="Farben auswählen"><button class="red" data-color="red" aria-label="Rot"></button><button class="blue" data-color="blue" aria-label="Blau"></button><button class="green" data-color="green" aria-label="Grün"></button><button class="yellow" data-color="yellow" aria-label="Gelb"></button><button class="purple" data-color="purple" aria-label="Lila"></button><button class="orange" data-color="orange" aria-label="Orange"></button></div><div class="controls"><button id="submit">Tipp prüfen</button><button id="new-game" class="secondary">🔄 Neues Spiel</button></div><p class="legend"><b class="dark"></b> richtige Farbe, richtiger Platz <b class="white"></b> richtige Farbe, falscher Platz</p><p class="version">Codeknacker · Version 1.1.0 · Build 2026-08-09.6</p></main>
