<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ec4899"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Tier-Memory · Spielkasten</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 12px 28px;font-family:system-ui,sans-serif;text-align:center;color:#701a75;background:linear-gradient(145deg,#fbcfe8,#c4b5fd)}h1{margin:0;color:#fff;font-size:clamp(2rem,10vw,3.3rem);text-shadow:2px 3px #a21caf}.back{display:inline-block;margin:5px 0 10px;color:#701a75;font-weight:850}.game{max-width:590px;margin:auto;padding:16px;background:#fff7fb;border-radius:24px;box-shadow:0 16px 42px #701a7555}.bar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-weight:800}.bar label{padding:7px 11px;border-radius:12px;background:#fce7f3}.bar select,.new{border:0;border-radius:10px;padding:8px;font:800 1rem system-ui}.bar select{color:#831843;background:#fff}.new{background:#be185d;color:#fff}
.board{display:grid;gap:9px;width:100%;max-width:530px;margin:18px auto}.board[data-size="12"],.board[data-size="16"]{grid-template-columns:repeat(4,minmax(0,1fr))}.board[data-size="20"]{grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.memory-card{min-width:0;padding:0;border:0;background:transparent;aspect-ratio:1;cursor:pointer;perspective:700px}.card-inner{position:relative;display:block;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}.face-up .card-inner{transform:rotateY(180deg)}.card-back,.animal{position:absolute;inset:0;border-radius:15px;backface-visibility:hidden}.card-back{display:grid;place-items:center;background:linear-gradient(135deg,#be185d,#7c3aed);border:3px solid #fff;color:#fff;font-size:clamp(1.5rem,9vw,3rem);box-shadow:0 3px 8px #701a7544}.animal{transform:rotateY(180deg);background-image:url('assets/memory-animals.png');background-size:400% 300%;background-position:var(--x) var(--y);border:3px solid #fff;box-shadow:0 3px 8px #701a7533}.matched .animal{box-shadow:0 0 0 4px #fbbf24,0 3px 8px #701a7533}.message{min-height:1.5em;margin:5px 0;font-weight:850}.hint,.version{font-size:.84rem;color:#6b7280}.version{margin:12px 0 0}@media(max-width:400px){.board{gap:6px}.card-back,.animal{border-radius:11px}.game{padding:12px}}
</style></head><body>
<h1>🐾 Tier-Memory</h1><a class="back" href="index.html">← Zurück zur Spieleauswahl</a>
<main class="game"><div class="bar"><label>Karten: <select id="card-count"><option value="12">12</option><option value="16">16</option><option value="20">20</option></select></label><span>🧠 Züge: <b id="moves">0</b></span><button id="new-game" class="new">🔄 Neu</button></div><div id="board" class="board" aria-label="Memory-Karten"></div><p id="message" class="message"></p><p class="hint">Drehe immer zwei Karten um und finde alle Tierpaare.</p><p class="version">Tier-Memory · Version 1.0.1 · Build 2026-08-09.11</p></main>
<script src="memory.js?v=1.0.0"></script><script src="memory-app.js?v=1.1.0"></script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')</script>
</body></html>
