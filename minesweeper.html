<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0891b2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Minenfeld · Spielkasten</title>
  <link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 10px 28px;font-family:system-ui,sans-serif;text-align:center;color:#164e63;background:linear-gradient(145deg,#a5f3fc,#06b6d4)}h1{margin:0;color:#fff;font-size:clamp(2rem,10vw,3.4rem);text-shadow:2px 3px #0e7490}.back{display:inline-block;margin:5px 0 10px;color:#155e75;font-weight:800}.game{max-width:500px;margin:auto;padding:14px;min-width:0;background:#ecfeff;border-radius:24px;box-shadow:0 16px 42px #155e7555}.settings{margin:0 0 10px;font-weight:850}.settings select{border:0;border-radius:10px;padding:8px;background:#cffafe;color:#155e75;font:inherit;font-weight:850}.top{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}.counter{min-width:78px;background:#155e75;color:#fff;border-radius:11px;padding:8px 12px;font-weight:850;font-size:1rem}.board{--cols:9;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:3px;width:100%;max-width:430px;margin:15px auto;padding:5px;background:#0e7490;border-radius:9px;touch-action:manipulation}.cell{aspect-ratio:1;border:0;border-radius:3px;background:#a5f3fc;color:#164e63;font-weight:900;font-size:clamp(.68rem,5vw,1.45rem);box-shadow:inset -2px -2px #0e749066}.cell.revealed{background:#ecfeff;box-shadow:none}.cell.mine{background:#fda4af}.cell.n1{color:#2563eb}.cell.n2{color:#15803d}.cell.n3{color:#dc2626}.cell.n4{color:#7e22ce}button#new-game{border:0;border-radius:11px;padding:10px 14px;background:#155e75;color:#fff;font:800 1rem system-ui}.message{min-height:1.5em;font-weight:750}.best{font-size:.84rem;color:#0e7490}.version{font-size:.8rem;color:#0e7490}
  </style>
</head>
<body>
  <h1>💣 Minenfeld</h1><a class="back" href="index.html">← Zurück zur Spieleauswahl</a>
  <main class="game">
    <p class="settings"><label>Schwierigkeit <select id="difficulty"><option value="easy">🌱 Einfach</option><option value="medium">🎯 Mittel</option><option value="hard">🔥 Schwer</option></select></label></p>
    <div class="top"><div class="counter">🚩 <span id="mines">10</span></div><div class="counter">⏱ <span id="time">0 s</span></div><button id="new-game">🔄 Neu</button></div>
    <div class="board" id="board" aria-label="Minenfeld"></div><p id="message" class="message"></p><p class="best">Bestzeit: <span id="best">–</span></p>
  </main>
  <script src="minesweeper.js?v=1.1.0"></script><script src="minesweeper-app.js?v=1.1.0"></script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')</script>
</body>
</html>
