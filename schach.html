<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#312e2b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Schach · Spielkasten</title>
  <link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:calc(16px + env(safe-area-inset-top)) 12px calc(28px + env(safe-area-inset-bottom));text-align:center;font-family:system-ui,-apple-system,sans-serif;color:#172033;background:linear-gradient(145deg,#312e2b,#5b4636 50%,#a08155)}.back{display:inline-block;color:#fff7ed;font-weight:800;text-decoration:none;margin:2px 0 10px}h1{font-size:clamp(1.7rem,7vw,2.4rem);color:#fff;margin:0 0 3px}.game{max-width:590px;margin:auto;background:#fff;border-radius:24px;padding:15px;box-shadow:0 14px 42px #1c191755}.top{display:flex;justify-content:center;align-items:center;gap:10px;margin:3px 0 12px}.top label{font-weight:850}.top select,.controls button,.start-color,.start-mode{font:inherit;border:0;border-radius:12px;padding:10px 12px}.top select{background:#f3e7d3;color:#493729;font-weight:850}.start-panel{margin:0 auto 12px;padding:12px;border-radius:16px;background:#f8efe2;color:#493729;font-weight:850}.start-panel[hidden]{display:none}.start-panel p{margin:0 0 8px}.start-modes,.start-colors{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.start-modes{margin-bottom:10px}.start-mode{background:#e8d5bb;color:#493729;font-weight:850}.start-mode.active{background:#6b4f36;color:#fff}.start-color{background:#6b4f36;color:#fff;font-weight:850}.start-color.black{background:#1f2937}.status{min-height:2.8em;margin:8px auto;font-weight:850;color:#493729}.board{display:grid;grid-template-columns:repeat(8,1fr);border-radius:8px;overflow:hidden;aspect-ratio:1;max-width:520px;margin:auto;box-shadow:0 2px 0 #312e2b;container-type:inline-size}.square{position:relative;border:0;padding:0;display:grid;place-items:center;aspect-ratio:1;font-family:"Apple Symbols","Segoe UI Symbol",serif;font-size:min(4.2rem,10.5cqw);line-height:.92;background:#f0d9b5;color:#fff;text-shadow:0 2px 1px #0008}.square.black-piece{color:#111827;text-shadow:0 1px 0 #ffffffdd,0 2px 2px #0007}.square.dark.black-piece{color:#080b12;text-shadow:0 1px 0 #ffffffaa,0 2px 2px #0009}.square.dark{background:#b58863}.square.selected{box-shadow:inset 0 0 0 5px #facc15}.square.legal::after{content:"";position:absolute;width:22%;aspect-ratio:1;border-radius:50%;background:#1720338c;pointer-events:none}.square.legal-capture::after{content:"";position:absolute;inset:7%;border:clamp(3px,.9cqw,6px) solid #172033a8;border-radius:50%;pointer-events:none}.square.last{box-shadow:inset 0 0 0 4px #f59e0b99}.square:focus-visible{outline:4px solid #2563eb;outline-offset:-4px;z-index:2}.square .coord{position:absolute;bottom:2px;left:3px;font:800 min(.85rem,2.8cqw) system-ui;color:#7c573c}.square.dark .coord{color:#f7e4c8}.square .file{position:absolute;right:3px;bottom:2px;font:800 min(.85rem,2.8cqw) system-ui;color:#7c573c}.square.dark .file{color:#f7e4c8}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:14px 0 4px}.controls button{color:#fff;background:#6b4f36;font-weight:850}.controls button.secondary{background:#475569}.controls button:disabled{opacity:.55}.version{color:#64748b;font-size:.78rem;margin:16px 0 0}.engine-note{font-size:.78rem;color:#78716c;margin:10px 0 0}@media(max-width:360px){.game{padding:10px}.controls button{padding:9px}}
  </style>
</head>
<body>
  <h1>♟️ Schach</h1><a class="back" href="index.html">← Zurück zur Spieleauswahl</a>
  <main class="game"><div class="top" id="level-control"><label for="level">Computer</label><select id="level"><option value="child">🧒 Kinder</option><option value="0">🌱 Einfach</option><option value="5" selected>🎯 Mittel</option><option value="10">🔥 Schwer</option><option value="16">👑 Profi</option></select></div><section id="start-panel" class="start-panel" hidden><p id="start-title">Wie wollt ihr spielen?</p><div class="start-modes"><button type="button" class="start-mode active" data-mode="computer">🤖 Gegen Computer</button><button type="button" class="start-mode" data-mode="human">👥 Zu zweit</button></div><div id="start-colors" class="start-colors"><button type="button" class="start-color" data-color="w">⚪ Weiß</button><button type="button" class="start-color black" data-color="b">⚫ Schwarz</button></div></section>
    <p class="status" id="status" aria-live="polite">Du spielst Weiß. Der Computer lädt …</p><div class="board" id="board" aria-label="Schachbrett"></div>
    <div class="controls"><button id="new-game">🔄 Neue Partie</button><button id="flip" class="secondary">↕️ Brett drehen</button></div><p class="engine-note" id="engine-note">Kinder: macht einfache Züge und lässt dir Chancen. Alle anderen Stufen laufen lokal auf deinem Gerät.</p><p class="version">Schach · Version 1.3.3 · Build 2026-08-10.20</p>
  </main>
  <script type="module" src="schach-app.js?v=1.3.3"></script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')</script>
</body></html>
