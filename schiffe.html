<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1d4ed8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Schiffe versenken · Spielkasten</title>
  <link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:16px 12px 28px;text-align:center;font-family:system-ui,-apple-system,sans-serif;color:#172033;background:linear-gradient(145deg,#1d4ed8,#38bdf8)}.back{display:inline-block;color:#e0f2fe;font-weight:800;text-decoration:none;margin:2px 0 10px}h1{font-size:clamp(1.7rem,7vw,2.4rem);color:#fff;margin:0 0 3px}.game{max-width:590px;margin:auto;background:#fff;border-radius:24px;padding:15px;box-shadow:0 14px 42px #082f4955}.hint{min-height:2.7em;margin:9px auto;font-weight:800;color:#1e3a8a}.message{min-height:1.5em;margin:9px;color:#0e7490;font-weight:850}.message[hidden]{display:none}.start-panel{margin:4px auto 14px;padding:14px;border-radius:18px;background:#eff6ff;color:#1e3a8a;font-weight:850}.start-panel[hidden]{display:none}.start-panel p{margin:0 0 10px}.start-buttons{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.start-buttons button{border:0;border-radius:12px;padding:11px 13px;color:#fff;background:#1d4ed8;font:800 1rem system-ui}.start-buttons .human{background:#475569}.level-picker{margin-top:12px}.level-picker[hidden]{display:none}.level-picker small{display:block;margin-bottom:8px}.level-picker button{background:#0e7490}.grid{display:grid;grid-template-columns:repeat(10,1fr);border:3px solid #1e3a8a;max-width:470px;margin:10px auto;aspect-ratio:1}.cell{display:grid;place-items:center;padding:0;border:1px solid #bae6fd;background:#e0f2fe;min-width:0;aspect-ratio:1;font-size:clamp(.72rem,4.4vw,1.5rem);line-height:1}.cell.ship{background:#64748b}.cell.concealed{background:repeating-linear-gradient(135deg,#93c5fd 0 7px,#bfdbfe 7px 14px)}.cell.preview{background:#93c5fd;outline:3px solid #16a34a;outline-offset:-3px}.cell.miss{background:#bae6fd}.cell.miss:after{content:'🌊';filter:saturate(1.2)}.cell.hit{background:#ffedd5}.cell.hit:after{content:'🎯'}.cell.sunk{background:#fecaca}.cell.sunk:after{content:'💥'}.reveal-fleet{border:0;border-radius:12px;padding:9px 12px;background:#e0f2fe;color:#1e3a8a;font:850 .95rem system-ui}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:12px 0}.controls button{border:0;border-radius:12px;padding:11px 13px;color:#fff;background:#1d4ed8;font:800 1rem system-ui}.controls button.secondary{background:#475569}.controls button.confirm{background:#16a34a;font-size:1.25rem}.controls button.cancel{background:#dc2626;font-size:1.25rem}.controls button:disabled{opacity:.5}.section-title{font-weight:900;color:#1e3a8a;margin-top:14px}.shot-result{margin:10px auto 18px;padding:16px 12px;border-radius:16px;font-weight:1000;font-size:clamp(2rem,11vw,3.25rem);color:#fff;text-shadow:0 3px 9px #172033;background:#0284c7;animation:result-pop 1.4s ease both}.shot-result.compact{margin:8px auto 12px;padding:10px;font-size:clamp(1.25rem,7vw,1.8rem);animation:none}.shot-result[hidden]{display:none!important}.shot-result.hit{background:#ea580c}.shot-result.sunk{background:#dc2626}@keyframes result-pop{0%{opacity:0;transform:scale(.55)}12%{opacity:1;transform:scale(1.08)}80%{opacity:1;transform:scale(1)}100%{opacity:.1;transform:scale(1.05)}}.version{color:#64748b;font-size:.78rem;margin:16px 0 0}@media(max-width:360px){.game{padding:10px}.controls button{padding:9px}.grid{margin:8px auto}}
  </style><style>body{padding:calc(16px + env(safe-area-inset-top)) 12px calc(28px + env(safe-area-inset-bottom))}</style>
</head>
<body>
  <h1>🚢 Schiffe versenken</h1><a class="back" href="index.html">← Zurück zur Spieleauswahl</a>
  <main class="game"><section class="start-panel" id="start-panel" hidden><p>Wie wollt ihr spielen?</p><div class="start-buttons"><button type="button" class="human" id="start-human">👥 Zu zweit</button><button type="button" id="start-computer">🤖 Gegen Computer</button></div><div class="level-picker" id="level-picker" hidden><small>Wie schlau soll der Computer sein?</small><div class="start-buttons"><button type="button" data-level="easy">🌱 Einfach</button><button type="button" data-level="medium">🎯 Mittel</button><button type="button" data-level="hard">🔥 Schwer</button></div></div></section><h2 id="title"></h2><p class="hint" id="hint"></p><p class="message" id="message" aria-live="polite"></p>
    <section id="handoff" hidden><div id="shot-result" hidden></div><p id="handoff-name" class="section-title"></p><p>Erst tippen, wenn die andere Person wirklich wegschaut.</p></section>
    <section id="setup"><div class="grid" id="setup-board"></div></section>
    <section id="battle" hidden><p class="section-title">Ziele auf das gegnerische Meer</p><div class="grid" id="target-board"></div><p class="section-title">Deine Flotte</p><button type="button" id="reveal-fleet" class="reveal-fleet">👁 Eigene Flotte anzeigen</button><div class="grid" id="own-board"></div></section>
    <div class="controls"><button type="button" id="rotate">↻ Drehen</button><button type="button" id="random">🎲 Alle zufällig</button><button type="button" id="confirm" class="confirm" hidden aria-label="Position bestätigen">✓</button><button type="button" id="cancel" class="cancel" hidden aria-label="Neu setzen">✕</button><button type="button" id="next">Gerät übergeben →</button><button type="button" id="continue" hidden>Weiter →</button><button type="button" id="restart" class="secondary">🔄 Neues Spiel</button></div>
    <p class="version">Schiffe versenken · Version 1.5.3 · Build 2026-08-08.31</p>
  </main>
  <script src="schiffe.js?v=1.5.2"></script><script src="schiffe-app.js?v=1.5.3"></script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')</script>
</body>
</html>
