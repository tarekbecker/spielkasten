<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Sudoku · Spielkasten</title>
  <link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;color:#172033;background:linear-gradient(145deg,#0f766e,#14b8a6 48%,#5eead4);padding:18px 14px 28px;text-align:center}h1{margin:4px 0 5px;color:#fff;font-size:clamp(1.8rem,7vw,2.4rem)}.back{display:inline-block;color:#e6fffb;margin-bottom:15px;text-decoration:none;font-weight:700}.game{max-width:560px;margin:auto;background:#fff;border-radius:24px;padding:18px;box-shadow:0 14px 40px #064e3b55}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.top label{font-weight:800}.top select,.controls button{font:inherit;border:0;border-radius:12px;padding:10px 12px}.top select{background:#ccfbf1;color:#115e59;font-weight:800}.board{display:grid;grid-template-columns:repeat(9,1fr);border:3px solid #115e59;border-radius:8px;overflow:hidden;aspect-ratio:1;margin:auto}.cell{min-width:0;border:0;border-right:1px solid #99f6e4;border-bottom:1px solid #99f6e4;background:#fff;color:#0f172a;font-size:clamp(1rem,5.5vw,1.65rem);font-weight:800;aspect-ratio:1}.cell:nth-child(3n){border-right:3px solid #115e59}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:3px solid #115e59}.cell.given{background:#f0fdfa;color:#134e4a}.cell.entry{color:#0e7490}.cell.focus-line:not(.selected):not(.conflict){background:#e0f2fe}.cell.focus-number{background:#bfdbfe!important;color:#1e3a8a;outline:2px solid #2563eb;outline-offset:-2px;position:relative;z-index:1}.cell.selected{background:#fef3c7;outline:3px solid #f59e0b;position:relative;z-index:2}.cell.conflict{background:#fee2e2;color:#b91c1c}.message{min-height:2.8em;margin:13px 0 6px;font-weight:800;color:#115e59}.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:8px 0 14px}.keypad button{border:0;border-radius:10px;padding:10px 0;background:#ccfbf1;color:#115e59;font-size:1.1rem;font-weight:900}.keypad button:last-child{background:#fee2e2;color:#b91c1c}.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.controls button{font-weight:850;background:#0f766e;color:#fff}.controls button.secondary{background:#475569}.version{margin:17px 0 0;color:#64748b;font-size:.78rem}@media(max-width:360px){.game{padding:12px}.keypad{gap:5px}.cell{font-size:1rem}}
  </style><style>body{padding:calc(18px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}</style>
</head>
<body>
  <h1>🔢 Sudoku</h1><a class="back" href="index.html">← Zurück zur Spieleauswahl</a>
  <main class="game"><div class="top"><label for="difficulty">Schwierigkeit</label><select id="difficulty"><option value="kinder">Kinder</option><option value="leicht">Leicht</option><option value="mittel" selected>Mittel</option><option value="schwer">Schwer</option><option value="profi">Profi</option></select></div>
    <div class="board" id="sudoku-board" aria-label="Sudoku Spielfeld"></div><p class="message" id="message" aria-live="polite">Tippe eine Zahl für Zeilen-, Spalten- und Zahlhilfe an.</p>
    <div class="keypad" id="keypad" aria-label="Zahlenfeld"><button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button data-value="0">⌫</button></div>
    <div class="controls"><button id="new-game">🔄 Neues Sudoku</button><button id="check" class="secondary">✓ Prüfen</button><button id="solve" class="secondary">💡 Lösung</button></div><p class="version">Sudoku · Version 1.3.1 · Build 2026-08-08.16</p>
  </main>
  <script src="sudoku.js?v=1.2.1"></script><script src="sudoku-app.js?v=1.3.1"></script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')</script>
</body></html>
